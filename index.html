.th-btn{background:none;border:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;padding:10px 12px;display:inline-flex;gap:4px;align-items:center;width:100%}

td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}

.chart-card .cwrap{min-height:120px}

.alist{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto}

 #sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);width:268px}
 body.nav-open #sidebar{transform:none}

/* ---------- Indian number formatting ---------- */
function fmtIN(n){
  if(n==null||!isFinite(n))return '—';
  const abs=Math.abs(n);
  const frac=Math.abs(abs-Math.round(abs))>=0.005;
  const s=abs.toFixed(frac?2:0);
  let [i,f]=s.split('.');
  const last3=i.slice(-3);let rest=i.slice(0,-3);
  if(rest)rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',')+',';
  const neg=n<0&&Number(s)!==0;
  return (neg?'-':'')+rest+last3+(f?'.'+f:'');
}
const inr=n=>{if(n==null||!isFinite(n))return '—';const s=fmtIN(n);return s[0]==='-'?'-₹'+s.slice(1):'₹'+s;};
function inWords(n){const a=Math.abs(n);if(!isFinite(n)||a<1e5)return '';const s=n<0?'-':'';if(a>=1e7)return s+(a/1e7).toFixed(2)+' Cr';return s+(a/1e5).toFixed(2)+' Lakh';}
function compact(n){const a=Math.abs(n),s=n<0?'-':'',t=x=>String(Math.round(x*10)/10);if(a>=1e7)return s+t(a/1e7)+'Cr';if(a>=1e5)return s+t(a/1e5)+'L';if(a>=1e3)return s+t(a/1e3)+'K';return s+t(a);}
const sgnCls=n=>n==null?'':n>0?'pos':n<0?'neg':'';

/* ---------- Dates (all local, stored as YYYY-MM-DD) ---------- */
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d&&y>=1990&&y<=2100;}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d+n));return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth()+1)}-${pad2(dt.getUTCDate())}`;}
function daysBetween(a,b){const f=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};return Math.round((f(b)-f(a))/864e5);}
function fmtDate(s){if(!validDate(s))return s||'—';const [y,m,d]=s.split('-').map(Number);return `${d} ${MON[m-1]} ${y}`;}
function fmtShort(s){const [,m,d]=s.split('-').map(Number);return `${d} ${MON[m-1]}`;}
function fmtMonth(k){const [y,m]=k.split('-');return `${MON[+m-1]} ${y.slice(2)}`;}
function fmtMonthLong(k){const [y,m]=k.split('-');return `${MONL[+m-1]} ${y}`;}
function weekStart(s){const [y,m,d]=s.split('-').map(Number);const dow=(new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7;return addDays(s,-dow);}

/* ---------- Number parsing / validation ---------- */
function parseNum(raw){
  const s=String(raw==null?'':raw).trim().replace(/,/g,'');
  if(s==='')return {blank:true};
  if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return {err:'enter a valid number'};
  const v=Number(s);
  if(!isFinite(v)||Math.abs(v)>1e12)return {err:'value is out of range'};
  return {v};
}
function checkNum(raw,{label='Value',required=false,gt,gte}={}){
  const p=parseNum(raw);
  if(p.err)return {err:`${label}: ${p.err}`};
  if(p.blank)return required?{err:`${label} is required`,blank:true}:{v:null};
  if(gt!=null&&!(p.v>gt))return {err:`${label} must be greater than ${gt}`};
  if(gte!=null&&!(p.v>=gte))return {err:gte===0?`${label} cannot be negative`:`${label} must be at least ${gte}`};
  return {v:p.v};
}
const cleanStr=(s,max)=>String(s==null?'':s).replace(/[\u0000-\u001f]+/g,' ').trim().slice(0,max);
const normTruck=s=>cleanStr(s,30).replace(/\s+/g,' ').toUpperCase();
const truckKey=s=>normTruck(s).replace(/[\s\-]/g,'');
function csvCell(v){if(v==null)return '';if(typeof v==='number')return String(v);let s=String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function toCSV(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';}
function download(name,content,mime){
  const blob=content instanceof Blob?content:new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
}

   DATA MODEL, METRICS
   ===================================================================== */
const TYPES={truck:'Truck',margin:'Margin-only',standard:'Standard'};
const DEFAULTS={id:'',type:'truck',date:'',commodity:'',truck:'',qty:0,sellPrice:null,procPrice:null,margin:null,expenses:null,customer:'',destination:'',remarks:'',createdAt:'',updatedAt:''};

function expensesOf(t){if(t.type!=='standard'||!t.expenses)return 0;const e=t.expenses;return (e.transport||0)+(e.loading||0)+(e.other||0)+(e.extras||[]).reduce((s,x)=>s+(x.amount||0),0);}
/* INTERNAL ONLY: total profit is never rendered for truck / margin-only records. */
function profitInternal(t){return t.type==='standard'?t.qty*(t.sellPrice-t.procPrice)-expensesOf(t):t.qty*t.margin;}
const effMargin=t=>profitInternal(t)/t.qty;
const salesOf=t=>t.sellPrice==null?0:t.qty*t.sellPrice;
function standardMetrics(t){
  const q=t.qty,proc=q*t.procPrice,sales=q*t.sellPrice,exp=expensesOf(t),gross=sales-proc,net=gross-exp;
  return {proc:r2(proc),sales:r2(sales),exp:r2(exp),gross:r2(gross),net:r2(net),netPerQ:r2(net/q),pct:sales>0?r2(net/sales*100):null,totalCost:r2(proc+exp),breakEven:r2((proc+exp)/q)};
}
function missingFields(r){
  const m=[];
  if(!r.commodity)m.push('commodity');
  if(r.type==='truck'){if(!r.customer)m.push('customer');if(!r.destination)m.push('destination');}
  return m;
}
function statusOf(r){if(effMargin(r)<0)return 'Loss';return missingFields(r).length?'Incomplete':'Complete';}
const statusCls=s=>s==='Loss'?'neg':s==='Incomplete'?'warn':'pos';

function aggregate(list){
  const A={n:list.length,truckEntries:0,truckQty:0,qty:0,sales:0,proc:0,procN:0,qtyPriced:0,_p:0,maxM:null,minM:null,maxRec:null,minRec:null,days:0};
  const days=new Set();
  for(const r of list){
    A.qty+=r.qty;days.add(r.date);
    if(r.type==='truck'){A.truckEntries++;A.truckQty+=r.qty;}
    if(r.sellPrice!=null){A.sales+=r.qty*r.sellPrice;A.qtyPriced+=r.qty;}
    if(r.type==='standard'){A.proc+=r.qty*r.procPrice;A.procN++;}
    A._p+=profitInternal(r);
    const m=effMargin(r);
    if(A.maxM===null||m>A.maxM){A.maxM=m;A.maxRec=r;}
    if(A.minM===null||m<A.minM){A.minM=m;A.minRec=r;}
  }
  A.days=days.size;
  A.wPrice=A.qtyPriced>0?A.sales/A.qtyPriced:null;   // quantity-weighted
  A.wMargin=A.qty>0?A._p/A.qty:null;                  // quantity-weighted
  A.avgTruckQty=A.truckEntries?A.truckQty/A.truckEntries:null;
  return A;
}

/* ---------- validation / sanitising (used for import and load) ---------- */
function sanitizeRecord(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return {error:'not an object'};
  if(!TYPES[raw.type])return {error:'unknown type'};
  const id=cleanStr(raw.id,40);if(!id)return {error:'missing id'};
  if(!validDate(raw.date))return {error:'invalid date'};
  const isN=v=>(typeof v==='number'||(typeof v==='string'&&v.trim()!==''))&&isFinite(Number(v))&&Math.abs(Number(v))<=1e12;
  if(!isN(raw.qty)||Number(raw.qty)<=0)return {error:'invalid quantity'};
  const rec=Object.assign({},DEFAULTS,{id,type:raw.type,date:raw.date,qty:Number(raw.qty),commodity:cleanStr(raw.commodity,80),truck:normTruck(raw.truck),customer:cleanStr(raw.customer,80),destination:cleanStr(raw.destination,80),remarks:cleanStr(raw.remarks,500)});
  const t=Date.parse(raw.createdAt);rec.createdAt=isFinite(t)?new Date(t).toISOString():nowIso();
  const u=Date.parse(raw.updatedAt);rec.updatedAt=isFinite(u)?new Date(u).toISOString():rec.createdAt;
  if(raw.sample===true)rec.sample=true;
  if(raw.type==='truck'){
    if(!isN(raw.sellPrice)||Number(raw.sellPrice)<=0)return {error:'invalid selling price'};
    if(!isN(raw.margin))return {error:'invalid margin'};
    rec.sellPrice=Number(raw.sellPrice);rec.margin=Number(raw.margin);
  }else if(raw.type==='margin'){
    if(!isN(raw.margin))return {error:'invalid margin'};
    rec.margin=Number(raw.margin);
  }else{
    if(!isN(raw.procPrice)||Number(raw.procPrice)<0)return {error:'invalid procurement price'};
    if(!isN(raw.sellPrice)||Number(raw.sellPrice)<0)return {error:'invalid selling price'};
    rec.procPrice=Number(raw.procPrice);rec.sellPrice=Number(raw.sellPrice);
    const e=raw.expenses||{};const ex={transport:0,loading:0,other:0,extras:[]};
    for(const k of ['transport','loading','other']){if(e[k]==null||e[k]==='')continue;if(!isN(e[k])||Number(e[k])<0)return {error:'invalid '+k+' expense'};ex[k]=Number(e[k]);}
    if(e.extras!=null){if(!Array.isArray(e.extras)||e.extras.length>30)return {error:'invalid extra expenses'};
      for(const x of e.extras){if(!x||!isN(x.amount)||Number(x.amount)<0)return {error:'invalid extra expense amount'};ex.extras.push({name:cleanStr(x.name,40)||'Expense',amount:Number(x.amount)});}}
    rec.expenses=ex;rec.truck='';
  }
  return {rec};
}

const DB={records:[],seq:0,tomb:{},dirty:new Set(),syncRev:0,serverId:'',lastSync:'',storageOk:false,writeFailed:false,corrupt:false,dropped:0,mem:null};
function storageProbe(){try{const k='__agrimargin_probe';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}}
function resetSyncMeta(){DB.tomb={};DB.dirty=new Set();DB.syncRev=0;DB.serverId='';DB.lastSync='';}
function dbLoad(){
  DB.storageOk=storageProbe();DB.corrupt=false;DB.dropped=0;
  let txt=null;
  if(DB.storageOk){try{txt=localStorage.getItem(KEY);}catch(e){DB.storageOk=false;}}
  else txt=DB.mem;
  if(!txt){DB.records=[];DB.seq=0;resetSyncMeta();return;}
  try{
    const data=JSON.parse(txt);const arr=Array.isArray(data)?data:data&&data.records;
    if(!Array.isArray(arr))throw new Error('bad shape');
    const seen=new Set(),out=[];
    for(const raw of arr){const s=sanitizeRecord(raw);if(s.rec&&!seen.has(s.rec.id)){seen.add(s.rec.id);out.push(s.rec);}else DB.dropped++;}
    DB.records=out;DB.seq=Math.max(0,parseInt(data&&data.seq,10)||0);
    resetSyncMeta();
    if(data&&data.tomb&&typeof data.tomb==='object'&&!Array.isArray(data.tomb)){for(const [k,v] of Object.entries(data.tomb)){if(typeof v==='string'&&isFinite(Date.parse(v)))DB.tomb[cleanStr(k,40)]=v;}}
    DB.dirty=new Set((data&&Array.isArray(data.dirty)?data.dirty:[]).filter(id=>seen.has(id)));
    DB.syncRev=Math.max(0,parseInt(data&&data.syncRev,10)||0);
    DB.serverId=data&&typeof data.serverId==='string'?data.serverId.slice(0,64):'';
    DB.lastSync=data&&typeof data.lastSync==='string'&&isFinite(Date.parse(data.lastSync))?data.lastSync:'';
  }catch(e){
    DB.corrupt=true;DB.records=[];resetSyncMeta();
    try{localStorage.setItem(KEY+'.corrupt-backup',txt);}catch(_){}
  }
}
function persist(noSync){const ok=persistRaw();if(!noSync)scheduleSync();return ok;}
function persistRaw(){
  const payload=JSON.stringify({app:'AgriMargin',version:1,savedAt:nowIso(),seq:DB.seq,tomb:DB.tomb,dirty:[...DB.dirty],syncRev:DB.syncRev,serverId:DB.serverId,lastSync:DB.lastSync,records:DB.records});
  if(!DB.storageOk){DB.mem=payload;DB.writeFailed=true;updateChrome();return false;}
  try{localStorage.setItem(KEY,payload);DB.writeFailed=false;updateChrome();return true;}
  catch(e){DB.writeFailed=true;DB.mem=payload;updateChrome();toast('Could not write to browser storage (it may be full or blocked). Your changes are kept for this session only – export a JSON backup now.','error');return false;}
}
function nextId(extra){
  const all=DB.records.concat(extra||[]);let max=DB.seq||0;const have=new Set(all.map(r=>r.id));
  for(const r of all){const m=/^TXN-(\d+)$/.exec(r.id);if(m)max=Math.max(max,+m[1]);}
  let n=max+1,id;do{id='TXN-'+String(n++).padStart(4,'0');}while(have.has(id));DB.seq=n-1;return id;
}
function dbAdd(fields){const rec=Object.assign({},DEFAULTS,fields,{id:nextId(),createdAt:nowIso(),updatedAt:nowIso()});DB.records.push(rec);DB.dirty.add(rec.id);delete DB.tomb[rec.id];persist();return rec;}
function dbUpdate(id,fields){const i=DB.records.findIndex(r=>r.id===id);if(i<0)return null;const old=DB.records[i];DB.records[i]=Object.assign({},DEFAULTS,old,fields,{id:old.id,createdAt:old.createdAt,updatedAt:nowIso()});DB.dirty.add(old.id);persist();return DB.records[i];}
function dbRemove(id){const n=DB.records.length;DB.records=DB.records.filter(r=>r.id!==id);if(DB.records.length<n){DB.dirty.delete(id);DB.tomb[id]=nowIso();}persist();return DB.records.length<n;}
/* bulk replace: records that vanish become tombstones, new/changed ones are marked for upload */
function dbSetRecords(next,opts){
  opts=opts||{};const now=nowIso();
  const old=new Map(DB.records.map(r=>[r.id,r])),keep=new Set(next.map(r=>r.id));
  old.forEach((r,id)=>{if(!keep.has(id)){DB.tomb[id]=now;DB.dirty.delete(id);}});
  DB.records=next.map(r=>{
    const o=old.get(r.id);
    if(!o){DB.dirty.add(r.id);delete DB.tomb[r.id];return opts.touch?Object.assign({},r,{updatedAt:now}):r;}
    if(opts.touch&&JSON.stringify(o)!==JSON.stringify(r)){DB.dirty.add(r.id);return Object.assign({},r,{createdAt:o.createdAt,updatedAt:now});}
    return r;
  });
  persist();
}
const getRec=id=>DB.records.find(r=>r.id===id);

function periodRange(p){
  const t=todayStr();
  switch(p.key){
    case 'today':return [t,t];
    case '7':return [addDays(t,-6),t];
    case '30':return [addDays(t,-29),t];
    case '90':return [addDays(t,-89),t];
    case 'month':{const [y,m]=t.split('-').map(Number);return [`${y}-${pad2(m)}-01`,`${y}-${pad2(m)}-${pad2(new Date(Date.UTC(y,m,0)).getUTCDate())}`];}
    case 'prev':{let [y,m]=t.split('-').map(Number);m--;if(m===0){m=12;y--;}return [`${y}-${pad2(m)}-01`,`${y}-${pad2(m)}-${pad2(new Date(Date.UTC(y,m,0)).getUTCDate())}`];}
    case 'custom':return [p.from||'0000-01-01',p.to||'9999-12-31'];
    default:return ['0000-01-01','9999-12-31'];
  }
}

function niceScale(min,max,ticks=4){
  if(min===max)max=min+1;
  const raw=(max-min)/ticks,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;
  const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step,t=[];
  for(let i=0;lo+i*step<=hi+step/2;i++)t.push(lo+i*step);
  return {lo,hi:Math.max(hi,lo+step),ticks:t};
}
function axes(items,vals,opts={}){
  const W=CW(),H=opts.h||250,L=50,R=12,T=14,B=36,pw=W-L-R,ph=H-T-B;
  const sc=niceScale(Math.min(0,...vals),Math.max(0,...vals));
  const y=v=>T+ph-(v-sc.lo)/(sc.hi-sc.lo)*ph;
  let g='';
  sc.ticks.forEach(t=>{const yy=y(t);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-7}" y="${yy+4}" text-anchor="end">${compact(t)}</text>`;});
  return {W,H,L,R,T,B,pw,ph,sc,y,g};
}
function xLabels(items,x,ax){
  const every=Math.max(1,Math.ceil(items.length/Math.max(1,Math.floor(ax.pw/46))));
  return items.map((it,i)=>i%every===0?`<text x="${x(i)}" y="${ax.H-ax.B+16}" text-anchor="middle">${esc(it.label)}</text>`:'').join('');
}
function barChart(items,{fmt=fmtIN,color='var(--c1)',unit=''}={}){
  if(!items.length)return emptyChart();
  const ax=axes(items,items.map(i=>i.value)),gap=ax.pw/items.length,bw=Math.min(42,gap*.7);
  const x=i=>ax.L+gap*i+gap/2,y0=ax.y(0);
  let bars='';
  items.forEach((it,i)=>{const yy=ax.y(it.value),h=Math.max(1,Math.abs(yy-y0));bars+=`<g class="bar"><rect x="${x(i)-bw/2}" y="${it.value>=0?yy:y0}" width="${bw}" height="${h}" rx="3" style="fill:${it.value<0?'var(--neg)':color}"/><title>${esc(it.label)}: ${esc(fmt(it.value))}${unit}</title></g>`;});
  return `<svg class="chart" viewBox="0 0 ${ax.W} ${ax.H}" role="img" aria-label="Bar chart">${ax.g}${bars}${xLabels(items,x,ax)}</svg>`;
}
function lineChart(items,{fmt=fmtIN,color='var(--c1)',unit=''}={}){
  if(!items.length)return emptyChart();
  const ax=axes(items,items.map(i=>i.value));
  const x=i=>items.length===1?ax.L+ax.pw/2:ax.L+ax.pw*i/(items.length-1);
  const pts=items.map((it,i)=>[x(i),ax.y(it.value)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=items.length>1?`<path d="${d} L${pts[pts.length-1][0].toFixed(1)} ${ax.y(0)} L${pts[0][0].toFixed(1)} ${ax.y(0)}Z" style="fill:${color};opacity:.12"/>`:'';
  const dots=pts.map((p,i)=>`<g class="bar"><circle cx="${p[0]}" cy="${p[1]}" r="4" style="fill:${color};stroke:var(--surface);stroke-width:2"/><title>${esc(items[i].label)}: ${esc(fmt(items[i].value))}${unit}</title></g>`).join('');
  return `<svg class="chart" viewBox="0 0 ${ax.W} ${ax.H}" role="img" aria-label="Line chart">${ax.g}${area}<path d="${d}" fill="none" style="stroke:${color};stroke-width:2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xLabels(items,x,ax)}</svg>`;
}
function doughnut(items,{fmt=fmtIN,unit=''}={}){
  items=items.filter(i=>i.value>0).sort((a,b)=>b.value-a.value);
  const total=items.reduce((s,i)=>s+i.value,0);
  if(!(total>0))return emptyChart();
  if(items.length>8){const rest=items.slice(7).reduce((s,i)=>s+i.value,0);items=items.slice(0,7).concat([{label:'Others',value:rest}]);}
  const R=64,C=2*Math.PI*R;let off=0,circles='';
  items.forEach((it,i)=>{const len=it.value/total*C,vis=items.length>1?Math.max(len-1.6,.5):len;
    circles+=`<circle cx="90" cy="90" r="${R}" fill="none" style="stroke:var(--c${i+1});stroke-width:26" stroke-dasharray="${vis.toFixed(2)} ${(C-vis).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"><title>${esc(it.label)}: ${esc(fmt(it.value))}${unit} (${(it.value/total*100).toFixed(1)}%)</title></circle>`;off+=len;});
  const legend=items.map((it,i)=>`<li><i style="background:var(--c${i+1})"></i><span class="n" title="${esc(it.label)}">${esc(it.label)}</span><span>${esc(fmt(it.value))}</span><span class="p">${(it.value/total*100).toFixed(1)}%</span></li>`).join('');
  return `<div class="donut"><svg viewBox="0 0 180 180" role="img" aria-label="Doughnut chart">${circles}<text x="90" y="87" text-anchor="middle" style="font-size:10px">Total</text><text x="90" y="104" text-anchor="middle" style="font-size:14px;font-weight:650;fill:var(--text)">${esc(compact(total))}</text></svg><ul class="legend">${legend}</ul></div>`;
}
function hbarChart(items,{fmt=fmtIN,unit=''}={}){
  items=items.filter(i=>i.value>0);if(!items.length)return emptyChart();
  const max=Math.max(...items.map(i=>i.value));
  return `<div class="hbar">${items.map(i=>`<div class="h"><span class="n" title="${esc(i.label)}">${esc(i.label)}</span><span class="t"><i style="width:${(i.value/max*100).toFixed(1)}%"></i></span><b>${esc(fmt(i.value))}${unit}</b></div>`).join('')}</div>`;
}

/* ---------- chart data builders ---------- */
function bucketize(list){
  if(!list.length)return {mode:'day',items:[]};
  const dates=list.map(r=>r.date).sort(),span=daysBetween(dates[0],dates[dates.length-1]),mode=span>62?'month':'day';
  const g=new Map();list.forEach(r=>pushTo(g,mode==='day'?r.date:r.date.slice(0,7),r));
  return {mode,items:[...g.keys()].sort().map(k=>Object.assign({key:k,label:mode==='day'?fmtShort(k):fmtMonth(k)},aggregate(g.get(k))))};
}
function volumeBy(list,monthly){
  const g=new Map();list.forEach(r=>{const k=monthly?r.date.slice(0,7):r.date;g.set(k,(g.get(k)||0)+r.qty);});
  let keys=[...g.keys()].sort();if(!monthly)keys=keys.slice(-45);
  return keys.map(k=>({label:monthly?fmtMonth(k):fmtShort(k),value:r2(g.get(k))}));
}
function sumBy(list,keyFn,valFn){const g=new Map();list.forEach(r=>{const k=keyFn(r);g.set(k,(g.get(k)||0)+valFn(r));});return [...g].map(([label,value])=>({label,value:r2(value)}));}
function expenseBreakdown(list){
  const g=new Map();
  list.filter(r=>r.type==='standard').forEach(r=>{const e=r.expenses||{};
    const add=(k,v)=>{if(v>0)g.set(k,(g.get(k)||0)+v);};
    add('Transportation',e.transport);add('Loading',e.loading);add('Other',e.other);(e.extras||[]).forEach(x=>add(x.name||'Expense',x.amount));});
  return [...g].map(([label,value])=>({label,value:r2(value)}));
}

   ALERTS & INSIGHTS
   ===================================================================== */
function computeAlerts(all){
  const out=[];
  const push=(rec,sev,kind,msg,ids)=>out.push({id:rec.id,ids:ids||[rec.id],date:rec.date,sev,kind,msg});
  const byC=new Map();all.forEach(r=>pushTo(byC,r.commodity||'',r));
  const cStats=new Map();byC.forEach((arr,k)=>cStats.set(k,{n:arr.length,wM:aggregate(arr).wMargin,med:median(arr.filter(x=>x.sellPrice!=null).map(x=>x.sellPrice)),nP:arr.filter(x=>x.sellPrice!=null).length}));
  const medQty=median(all.map(r=>r.qty));
  const dup=new Map();all.forEach(r=>{if(r.truck)pushTo(dup,truckKey(r.truck)+'|'+r.date,r);});
  dup.forEach(arr=>{if(arr.length>1)push(arr[0],'warn','duplicate',`${arr.length} entries for truck ${arr[0].truck} on ${fmtDate(arr[0].date)} (${arr.map(x=>x.id).join(', ')}). Confirm these are separate trips.`,arr.map(x=>x.id));});
  for(const r of all){
    const m=effMargin(r),cs=cStats.get(r.commodity||'');
    const who=`${r.id}${r.truck?' · '+r.truck:''}${r.commodity?' · '+r.commodity:''}`;
    if(m<0)push(r,'danger','negative',`Negative margin of ${inr(m)}/Qtl on ${who}.`);
    else if(cs&&cs.n>=5&&cs.wM>0&&m<0.4*cs.wM)push(r,'warn','low',`Unusually low margin ${inr(m)}/Qtl on ${who} (typical ≈ ${inr(cs.wM)}/Qtl).`);
    if(r.sellPrice!=null&&cs&&cs.nP>=4&&cs.med>0){const dev=(r.sellPrice-cs.med)/cs.med;
      if(Math.abs(dev)>0.2)push(r,'warn','price',`Selling price ${inr(r.sellPrice)} on ${who} is ${Math.abs(dev*100).toFixed(0)}% ${dev>0?'above':'below'} the typical ${inr(cs.med)}.`);}
    if(all.length>=5&&medQty>0&&r.qty>2*medQty)push(r,'info','large',`Large quantity of ${fmtIN(r.qty)} Qtl on ${who} (typical ≈ ${fmtIN(medQty)} Qtl).`);
    const mf=missingFields(r);if(mf.length)push(r,'info','missing',`Missing details on ${who}: ${mf.join(', ')}.`);
  }
  const ord={danger:0,warn:1,info:2};
  return out.sort((a,b)=>ord[a.sev]-ord[b.sev]||(a.date<b.date?1:-1));
}
function alertsInPeriod(){const [a,b]=periodRange(S.period);return computeAlerts(DB.records).filter(x=>x.date>=a&&x.date<=b);}
function alertListHTML(alerts,limit){
  if(!alerts.length)return `<div class="empty small">${ICON('check',28)}<p>No alerts for this period.</p></div>`;

}

/* =====================================================================
   PDF (hand-built, standard Courier fonts, no libraries)
   ===================================================================== */
function pdfSafe(s){return String(s==null?'':s).replace(/₹/g,'Rs ').replace(/[\u00a0\u202f]/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[–—]/g,'-').replace(/[^\x20-\x7e]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');}
function makePDF(items){
  const PW=595,PH=842,M=36;let pages=[[]],y=PH-M-6;
  for(const it of items){
    const s=it.s||8.5,lh=s*1.42+(it.gap||0);
    if(y-lh<M+10){pages.push([]);y=PH-M-6;}
    y-=lh;pages[pages.length-1].push({x:M,y,s,b:!!it.b,t:it.t});
  }
  let out='%PDF-1.4\n';const offs=[];
  const add=(n,body)=>{offs[n]=out.length;out+=`${n} 0 obj\n${body}\nendobj\n`;};
  const np=pages.length;
  add(1,'<< /Type /Catalog /Pages 2 0 R >>');
  add(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${5+2*i} 0 R`).join(' ')}] /Count ${np} >>`);
  add(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>');
  add(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold >>');
  pages.forEach((p,i)=>{
    let c=p.map(l=>`BT /${l.b?'F2':'F1'} ${l.s} Tf ${l.x} ${l.y.toFixed(2)} Td (${pdfSafe(l.t)}) Tj ET`).join('\n');
    c+=`\nBT /F1 7 Tf ${M} 20 Td (AgriMargin report - page ${i+1} of ${np}) Tj ET`;
    add(5+2*i,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+2*i} 0 R >>`);
    add(6+2*i,`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
  });
  const total=5+2*np,xref=out.length;
  out+=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let n=1;n<total;n++)out+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([out],{type:'application/pdf'});
}
function pdfReport(list,label){
  const A=aggregate(list),L=[];
  const pr=(s,n)=>{s=pdfSafe(s).replace(/\\([\\()])/g,'$1');return s.length>n?s.slice(0,n-1)+'.':s.padEnd(n);};
  const pl=(s,n)=>{s=String(s);return s.length>n?s.slice(0,n):s.padStart(n);};
  const money=n=>n==null?'-':(n<0?'-':'')+'Rs '+fmtIN(Math.abs(n));
  L.push({t:'AgriMargin - Trading Report',s:16,b:true,gap:4});
  L.push({t:'Period: '+label});L.push({t:'Generated: '+new Date().toLocaleString('en-IN'),gap:6});
  L.push({t:'SUMMARY',b:true});
  [['Transactions',fmtIN(A.n)],['Truck entries',fmtIN(A.truckEntries)],['Total quantity (Qtl)',fmtIN(r2(A.qty))],['Sales turnover',money(r2(A.sales))],['Weighted avg selling price /Qtl',money(A.wPrice==null?null:r2(A.wPrice))],['Weighted avg margin /Qtl',money(A.wMargin==null?null:r2(A.wMargin))],['Total profit',money(r2(A._p))],['Trading days',fmtIN(A.days)]].forEach(([k,v])=>L.push({t:pr(k,34)+v}));
  const table=(title,kind)=>{

    L.push({t:'',gap:4});L.push({t:title.toUpperCase(),b:true});
    L.push({t:pr('Name',22)+pl('Txns',5)+pl('Qty(Qtl)',11)+pl('Turnover',16)+pl('Avg price',12)+pl('Avg margin',12)+pl('Profit',14),b:true});
    rows.forEach(a=>L.push({t:pr(a.label,22)+pl(a.n,5)+pl(fmtIN(r2(a.qty)),11)+pl(fmtIN(r2(a.sales)),16)+pl(a.wPrice==null?'-':fmtIN(r2(a.wPrice)),12)+pl(a.wMargin==null?'-':fmtIN(r2(a.wMargin)),12)+pl(fmtIN(r2(a._p)),14)}));
  };
  table('Commodity-wise performance','commodity');table('Truck-wise performance','truck');table('Customer-wise performance','customer');table('Monthly performance','monthly');
  L.push({t:'',gap:4});L.push({t:'TRANSACTIONS',b:true});
  L.push({t:pr('Date',11)+pr('ID',9)+pr('Commodity',13)+pr('Truck',14)+pl('Qty',9)+pl('Price',9)+pl('Margin',8)+' '+pr('Customer',20),b:true});
  list.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.id<b.id?1:-1).forEach(r=>L.push({t:pr(r.date,11)+pr(r.id,9)+pr(r.commodity||'-',13)+pr(r.truck||'-',14)+pl(fmtIN(r.qty),9)+pl(r.sellPrice==null?'-':fmtIN(r.sellPrice),9)+pl(fmtIN(r2(effMargin(r))),8)+' '+pr(r.customer||'-',20)}));
  L.push({t:'',gap:4});L.push({t:'Figures in Indian Rupees. Margin is per quintal. '});
  return makePDF(L);
}

function exportTxCSV(list,name){
  const rows=[['Transaction ID','Date','Type','Commodity','Truck','Quantity (Qtl)','Selling Price (Rs/Qtl)','Procurement Price (Rs/Qtl)','Margin (Rs/Qtl)','Sales Turnover (Rs)','Customer','Destination','Status','Remarks']];
  list.forEach(r=>rows.push([r.id,r.date,TYPES[r.type],r.commodity,r.truck,r.qty,r.sellPrice,r.procPrice,r2(effMargin(r)),r.sellPrice==null?null:r2(salesOf(r)),r.customer,r.destination,statusOf(r),r.remarks]));
  download(name||`agrimargin-transactions-${stamp()}.csv`,toCSV(rows),'text/csv;charset=utf-8');
  toast(`Exported ${list.length} record${list.length===1?'':'s'} to CSV`);
}
function exportJSON(){
  const data={app:'AgriMargin',version:1,exportedAt:nowIso(),records:DB.records};
  download(`agrimargin-backup-${stamp()}.json`,JSON.stringify(data,null,2),'application/json');
  toast(`Backup exported (${DB.records.length} records)`);
}

function sortList(list,sort){
  const m=sort.dir==='asc'?1:-1;
  const val={date:r=>r.date,qty:r=>r.qty,sellPrice:r=>r.sellPrice==null?-Infinity:r.sellPrice,margin:effMargin,truck:r=>truckKey(r.truck),commodity:r=>(r.commodity||'').toLowerCase(),customer:r=>(r.customer||'').toLowerCase(),id:r=>r.id,type:r=>r.type,status:statusOf,turnover:salesOf,destination:r=>(r.destination||'').toLowerCase()}[sort.key]||(r=>r.date);
  return list.slice().sort((a,b)=>{const x=val(a),y=val(b);if(x<y)return -m;if(x>y)return m;return a.id<b.id?-m:a.id>b.id?m:0;});
}
function filterRecords(list,f,scope){
  const q=(f.q||'').trim().toLowerCase(),qk=q.replace(/[\s\-]/g,'');
  return list.filter(r=>{
    if(f.type&&r.type!==f.type)return false;
    if(f.commodity&&r.commodity!==f.commodity)return false;
    if(f.customer&&r.customer!==f.customer)return false;
    if(f.status&&statusOf(r)!==f.status)return false;
    if(f.from&&r.date<f.from)return false;
    if(f.to&&r.date>f.to)return false;
    if(q){
      const tk=truckKey(r.truck).toLowerCase();
      if(scope==='truck'){if(!(tk.includes(qk)||r.truck.toLowerCase().includes(q)))return false;}
      else{const hay=[r.id,r.commodity,r.customer,r.destination,r.remarks,r.truck].join(' ').toLowerCase();if(!(hay.includes(q)||(qk&&tk.includes(qk))))return false;}
    }
    return true;
  });
}

function readCalcDOM(){
  const f=$('#calcForm');if(!f)return S.calc.draft;
  const g=n=>f.elements[n]?f.elements[n].value:'',d=S.calc.draft;
  Object.assign(d,{commodity:g('commodity'),date:g('date'),qty:g('qty'),proc:g('proc'),sell:g('sell'),transport:g('transport'),loading:g('loading'),other:g('other'),customer:g('customer'),margin:g('margin'),truck:g('truck')});
  d.extras=$$('.extra-row',f).map(r=>({name:$('[data-x=name]',r).value,amount:$('[data-x=amount]',r).value}));
  return d;
}
function applyCalcMode(){
  const d=S.calc.draft;
  $$('[data-mode-only]').forEach(e=>{e.hidden=e.dataset.modeOnly!==d.mode;});
  $('#modeStd').classList.toggle('on',d.mode==='standard');$('#modeMargin').classList.toggle('on',d.mode==='margin');
  $('#modeStd').setAttribute('aria-selected',d.mode==='standard');$('#modeMargin').setAttribute('aria-selected',d.mode==='margin');
  $('#lblCommodity').textContent=d.mode==='margin'?'Transaction Name / Commodity':'Commodity Name';
  $('#calcSaveLbl').textContent=S.calc.editingId?'Update Transaction':'Save as Transaction';
}
function calcCompute(d){
  const errors={},v={};
  const take=(k,raw,o)=>{const r=checkNum(raw,o);if(r.err)errors[k]={msg:r.err,blank:!!r.blank};else v[k]=r.v;};
  take('qty',d.qty,{label:'Quantity',required:true,gt:0});
  if(d.mode==='standard'){
    take('proc',d.proc,{label:'Procurement price',required:true,gte:0});
    take('sell',d.sell,{label:'Selling price',required:true,gte:0});
    take('transport',d.transport,{label:'Transportation',gte:0});take('loading',d.loading,{label:'Loading charges',gte:0});take('other',d.other,{label:'Other expenses',gte:0});
    d.extras.forEach((x,i)=>take('x'+i,x.amount,{label:'Expense amount',gte:0}));
  }else take('margin',d.margin,{label:'Margin per quintal',required:true});
  if(!validDate(d.date))errors.date={msg:'Select a valid date',blank:!d.date};
  return {errors,v};
}
function calcRecordLike(d,v){
  if(d.mode==='standard')return {type:'standard',qty:v.qty,procPrice:v.proc,sellPrice:v.sell,expenses:{transport:v.transport||0,loading:v.loading||0,other:v.other||0,extras:d.extras.map((x,i)=>({name:cleanStr(x.name,40)||`Expense ${i+1}`,amount:v['x'+i]||0}))}};
  return {type:'margin',qty:v.qty,margin:v.margin};
}
function renderCalcResults(){
  const el=$('#calcResults');if(!el)return;
  const d=readCalcDOM(),{errors,v}=calcCompute(d);
  const f=$('#calcForm');
  if(f){showErrors(f,Object.fromEntries(Object.entries(errors).filter(([k,e])=>!e.blank)));}
  const need=d.mode==='standard'?['qty','proc','sell']:['qty','margin'];
  const incomplete=need.some(k=>errors[k]);
  if(incomplete){
    el.innerHTML=`<h3>Results</h3><p class="sub">${d.mode==='standard'?'Standard calculation':'Margin-only calculation'}</p><div class="empty">${ICON('calc',32)}<p>${d.mode==='standard'?'Enter quantity, procurement price and selling price':'Enter quantity and margin per quintal'} to see results.</p></div>`;
    return;
  }
  const anyExpErr=Object.keys(errors).some(k=>!need.includes(k)&&k!=='date');
  if(d.mode==='margin'){
    const total=r2(v.qty*v.margin);
    el.innerHTML=`<h3>Results</h3><p class="sub">Margin-only calculation</p>
     <div class="res-hero"><div class="l">Total Margin</div><div class="v ${sgnCls(total)}">${inr(total)}</div><span class="badge ${total>0?'pos':total<0?'neg':'mute'}">${total>0?'Profit':total<0?'Loss':'Break-even'}</span> <span class="muted">${esc(inWords(total))}</span></div>
     <div class="rows"><div class="r"><span>Quantity</span><b>${fmtIN(v.qty)} Qtl</b></div><div class="r"><span>Margin per quintal</span><b class="${sgnCls(v.margin)}">${inr(v.margin)}</b></div><div class="r"><span>Formula</span><b>${fmtIN(v.qty)} × ${inr(v.margin)}</b></div></div>`;
    return;
  }
  if(anyExpErr){el.innerHTML=`<h3>Results</h3><p class="sub">Standard calculation</p><div class="notice warn">Fix the highlighted expense amounts to continue.</div>`;return;}
  const rec=calcRecordLike(d,v),m=standardMetrics(rec),q=v.qty,e=rec.expenses;
  const parts=[['Procurement',v.proc],['Transportation',(e.transport||0)/q],['Loading',(e.loading||0)/q],['Other expenses',(e.other||0)/q]].concat(e.extras.filter(x=>x.amount>0).map(x=>[x.name,x.amount/q]));

function saveCalc(){
  if(Date.now()<S.lock)return;
  const d=readCalcDOM(),{errors,v}=calcCompute(d),f=$('#calcForm');
  if(Object.keys(errors).length){const first=showErrors(f,errors);toast('Please fix the highlighted fields','error');if(first)first.focus();return;}
  const base={commodity:cleanStr(d.commodity,80),date:d.date,customer:cleanStr(d.customer,80)};
  const rl=calcRecordLike(d,v);
  const fields=Object.assign(base,rl.type==='standard'?{type:'standard',qty:rl.qty,procPrice:rl.procPrice,sellPrice:rl.sellPrice,margin:null,expenses:rl.expenses,truck:''}:{type:'margin',qty:rl.qty,margin:rl.margin,sellPrice:null,procPrice:null,expenses:null,truck:normTruck(d.truck)});
  let id;
  if(S.calc.editingId){const u=dbUpdate(S.calc.editingId,fields);if(!u){toast('That record no longer exists','error');S.calc.editingId=null;return;}id=u.id;toast(`${id} updated`);}
  else{id=dbAdd(fields).id;toast(`Saved as ${id}`);}
  S.lock=Date.now()+500;
  S.calc.editingId=null;S.calc.draft=Object.assign(blankDraft(),{mode:d.mode,date:d.date});
  refreshLists();updateChrome();VIEWS.calculator();
}
function exportCalc(){
  const d=readCalcDOM(),{errors,v}=calcCompute(d);
  const need=d.mode==='standard'?['qty','proc','sell']:['qty','margin'];
  if(need.some(k=>errors[k])||Object.keys(errors).length){toast('Complete the calculation with valid numbers before exporting','error');return;}
  const rows=[['Field','Value'],['Mode',d.mode==='standard'?'Standard':'Margin-only'],['Commodity',d.commodity],['Date',d.date],['Quantity (Qtl)',v.qty]];
  if(d.mode==='margin'){rows.push(['Margin per Quintal (Rs)',v.margin],['Total Margin (Rs)',r2(v.qty*v.margin)]);}
  else{const rec=calcRecordLike(d,v),m=standardMetrics(rec),q=v.qty;
    rows.push(['Procurement Price (Rs/Qtl)',v.proc],['Selling Price (Rs/Qtl)',v.sell],['Transportation (Rs)',v.transport||0],['Loading (Rs)',v.loading||0],['Other Expenses (Rs)',v.other||0]);
    rec.expenses.extras.forEach(x=>rows.push([`Expense: ${x.name} (Rs)`,x.amount]));
    rows.push(['Procurement Value (Rs)',m.proc],['Selling Value (Rs)',m.sales],['Total Expenses (Rs)',m.exp],['Gross Trading Margin (Rs)',m.gross],['Net Profit (Rs)',m.net],['Net Profit per Quintal (Rs)',m.netPerQ],['Profit Margin (%)',m.pct],['Break-even Selling Price (Rs/Qtl)',m.breakEven],['Total Cost per Quintal (Rs)',r2(m.totalCost/q)],['Status',m.net>0?'Profit':m.net<0?'Loss':'Break-even']);}
  download(`agrimargin-calculation-${stamp()}.csv`,toCSV(rows),'text/csv;charset=utf-8');toast('Calculation exported');
}
function startEditCalc(id){
  const r=getRec(id);if(!r)return;
  const d=blankDraft();
  Object.assign(d,{mode:r.type==='standard'?'standard':'margin',commodity:r.commodity,date:r.date,qty:String(r.qty),customer:r.customer});
  if(r.type==='standard'){Object.assign(d,{proc:String(r.procPrice),sell:String(r.sellPrice),transport:r.expenses.transport?String(r.expenses.transport):'',loading:r.expenses.loading?String(r.expenses.loading):'',other:r.expenses.other?String(r.expenses.other):'',extras:r.expenses.extras.map(x=>({name:x.name,amount:String(x.amount)}))});}
  else Object.assign(d,{margin:String(r.margin),truck:r.truck});

}

function validateTruck(f){

  const s=checkNum(g('sellPrice'),{label:'Selling price',required:true,gt:0});if(s.err)errors.sellPrice=s.err;
  const m=checkNum(g('margin'),{label:'Margin',required:true});if(m.err)errors.margin=m.err;
  return {errors,fields:{type:'truck',truck,date,qty:q.v,sellPrice:s.v,margin:m.v,procPrice:null,expenses:null,commodity:cleanStr(g('commodity'),80),customer:cleanStr(g('customer'),80),destination:cleanStr(g('destination'),80),remarks:cleanStr(g('remarks'),500)}};

function saveTruck(another){
  if(Date.now()<S.lock)return;

  const editId=f.dataset.edit;
  const dupe=DB.records.some(r=>r.id!==editId&&r.truck&&truckKey(r.truck)===truckKey(fields.truck)&&r.date===fields.date);

/* ---------- sample data ---------- */
function sampleRecords(){
  let seed=20260611;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const com=[{n:'Chana',p:6200,m:[80,220]},{n:'Maize',p:2250,m:[40,120]},{n:'Turmeric',p:14500,m:[200,520]},{n:'Soybean',p:4700,m:[60,160]},{n:'Tur Dal',p:9100,m:[100,300]}];
  const cus=['Sri Lakshmi Traders','Annapurna Foods','Bhavani Agro','Mahalakshmi Mills','Karnataka Grain Co.'],pl=['Bengaluru','Hubballi','Davanagere','Hyderabad','Chennai'];
  const trucks=['KA 34 AB 1234','KA 01 CD 5678','KA 05 EF 9012','AP 39 GH 3456','TN 09 JK 7788','KA 32 MN 2468'];
  const today=todayStr(),out=[];
  for(let i=0;i<42;i++){
    const c=pick(com),date=addDays(today,-Math.floor(rnd()*75)),qty=Math.round((120+rnd()*330)*2)/2;
    const price=Math.round(c.p*(0.94+rnd()*0.12)/5)*5;let margin=Math.round(c.m[0]+rnd()*(c.m[1]-c.m[0]));
    if(i%13===7)margin=-Math.round(20+rnd()*60);
    out.push({type:'truck',date,truck:pick(trucks),commodity:c.n,qty,sellPrice:price,margin,customer:i%6===0?'':pick(cus),destination:i%5===0?'':pick(pl),remarks:''});
  }
  for(let i=0;i<5;i++){const c=pick(com);out.push({type:'margin',date:addDays(today,-Math.floor(rnd()*50)),truck:i%2?pick(trucks):'',commodity:c.n,qty:Math.round(100+rnd()*200),margin:Math.round(c.m[0]+rnd()*(c.m[1]-c.m[0])),customer:pick(cus)});}
  for(let i=0;i<6;i++){const c=pick(com),proc=Math.round(c.p*(0.9+rnd()*.05)/5)*5;
    out.push({type:'standard',date:addDays(today,-Math.floor(rnd()*70)),commodity:c.n,qty:Math.round(100+rnd()*250),procPrice:proc,sellPrice:Math.round(proc*(1.02+rnd()*.05)/5)*5,expenses:{transport:Math.round(6000+rnd()*9000),loading:Math.round(800+rnd()*1500),other:Math.round(500+rnd()*2000),extras:i%2?[{name:'Unloading',amount:Math.round(700+rnd()*900)}]:[]},customer:pick(cus)});}
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return out;
}
async function loadSample(){
  const ok=await confirmDialog({title:'Load sample data?',message:'This adds about 53 demo records alongside your existing data. You can remove them later from Settings → Sample data.',confirmLabel:'Add sample records'});
  if(!ok)return;
  const recs=sampleRecords(),now=nowIso();
  recs.forEach(f=>{const rec=Object.assign({},DEFAULTS,f,{id:nextId(),sample:true,createdAt:now,updatedAt:now});DB.records.push(rec);DB.dirty.add(rec.id);});
  persist();toast(`Added ${recs.length} sample records`);render();
}
async function removeSample(){
  const n=DB.records.filter(r=>r.sample).length;if(!n)return;
  const ok=await confirmDialog({title:'Remove sample data?',message:`Remove ${n} sample record(s)? Your own records are not touched.`,confirmLabel:'Remove',danger:true});

}
async function clearAll(){

/* ---------- import ---------- */
let pendingImport=null;
function handleImportFile(file){
  if(!file)return;
  if(file.size>25*1024*1024){toast('File is too large (max 25 MB)','error');return;}
  const fr=new FileReader();
  fr.onerror=()=>toast('Could not read the file','error');
  fr.onload=()=>processImport(String(fr.result),file.name);
  fr.readAsText(file);
}
function processImport(text,name){
  let data;
  try{data=JSON.parse(text.replace(/^\ufeff/,''));}catch(e){toast('That file is not valid JSON – nothing was imported','error');return;}
  const arr=Array.isArray(data)?data:(data&&Array.isArray(data.records)?data.records:null);
  if(!arr){toast('This does not look like an AgriMargin backup (no records list) – nothing was imported','error');return;}
  if(!Array.isArray(data)&&data.app&&data.app!=='AgriMargin'){toast('This backup was not created by AgriMargin – nothing was imported','error');return;}
  const valid=[],bad=[],seen=new Set();
  arr.forEach((raw,i)=>{const s=sanitizeRecord(raw);
    if(s.error)bad.push(`Row ${i+1}: ${s.error}`);
    else if(seen.has(s.rec.id))bad.push(`Row ${i+1}: duplicate id ${s.rec.id} in file`);
    else{seen.add(s.rec.id);valid.push(s.rec);}});
  if(!valid.length){toast(`No valid records found in ${name} – nothing was imported`,'error');return;}
  const existing=new Set(DB.records.map(r=>r.id)),fresh=valid.filter(r=>!existing.has(r.id));
  pendingImport={valid,fresh};
  Modal.open({title:'Restore backup',body:`<p><b>${esc(name)}</b> contains <b>${arr.length}</b> record(s): <b class="pos">${valid.length} valid</b>${bad.length?`, <b class="neg">${bad.length} invalid</b> (will be skipped)`:''}.</p>
   ${bad.length?`<div class="notice warn" style="margin-top:10px"><b>Skipped:</b><br>${bad.slice(0,6).map(esc).join('<br>')}${bad.length>6?`<br>…and ${bad.length-6} more`:''}</div>`:''}
   <div class="rows" style="margin-top:10px"><div class="r"><span>Records currently in AgriMargin</span><b>${DB.records.length}</b></div><div class="r"><span>New records in file (not already present)</span><b>${fresh.length}</b></div></div>
   <p class="muted" style="margin-top:10px">Nothing has been changed yet. <b>Merge</b> adds only new records and keeps all your existing ones. <b>Replace</b> deletes your ${DB.records.length} current record(s) and uses the file instead.</p>`,
   footer:`<button class="btn" data-action="modal-close">Cancel</button><button class="btn" data-action="import-merge">Merge (add ${fresh.length} new)</button><button class="btn danger" data-action="import-replace">Replace all data</button>`});
}
function applyImport(mode){
  if(!pendingImport)return;
  const {valid,fresh}=pendingImport;pendingImport=null;
  dbSetRecords(mode==='replace'?valid.slice():DB.records.concat(fresh),{touch:true});
  Modal.close();
  toast(mode==='replace'?`Restored ${valid.length} records (previous data replaced)`:`Merged ${fresh.length} new record(s); ${valid.length-fresh.length} already existed and were kept`);
  const inp=$('#importFile');if(inp)inp.value='';render();
}

   ===================================================================== */
const Sync={mode:'unknown',busy:false,again:false,timer:null,err:'',hasRecovery:null};
const syncEnabled=()=>Sync.mode==='on'||Sync.mode==='offline';
function scheduleSync(delay){if(!syncEnabled())return;clearTimeout(Sync.timer);Sync.timer=setTimeout(()=>syncNow(),delay==null?1200:delay);}
function pendingCount(){return DB.dirty.size+Object.keys(DB.tomb).length;}
function syncLabel(){
  switch(Sync.mode){
    case 'login':return 'Sign in to sync';
    case 'offline':return 'Offline – will sync when connected';
    case 'on':
      if(Sync.busy)return 'Syncing…';
      if(Sync.err)return 'Sync problem – will retry';
      if(pendingCount())return 'Changes waiting to sync';
      return 'Synced'+(DB.lastSync?' · '+new Date(DB.lastSync).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'');
    default:return '';
  }
}
function renderSyncCard(){
  const el=$('#syncBody');if(!el)return;
  if(Sync.mode==='off'||Sync.mode==='unknown'){el.innerHTML='<p class="muted">Sync is not available in this copy – it only works when AgriMargin is served by its own server (the Render web-service deployment). Your data is stored in this browser.</p>';return;}
  el.innerHTML=`<div class="rows"><div class="r"><span>Status</span><b>${esc(syncLabel()||'—')}</b></div><div class="r"><span>Last synced</span><b>${DB.lastSync?esc(new Date(DB.lastSync).toLocaleString('en-IN')):'Never'}</b></div><div class="r"><span>Waiting to upload</span><b>${pendingCount()}</b></div></div>${Sync.err?`<div class="notice warn" style="margin-top:10px">${esc(Sync.err)}</div>`:''}<div class="btnrow" style="margin-top:12px"><button class="btn primary" data-action="sync-now">Sync now</button><button class="btn" data-action="sync-logout">Sign out</button></div>
  <h4 style="margin:18px 0 6px">Password &amp; recovery</h4><div class="rows"><div class="r"><span>Recovery key</span><b>${Sync.hasRecovery?'<span class="pos">Created</span>':'<span class="warn">Not created</span>'}</b></div></div>
  <div class="btnrow" style="margin-top:10px"><button class="btn" data-action="pw-change">Change password</button><button class="btn" data-action="rec-open">${Sync.hasRecovery?'Replace recovery key':'Create recovery key'}</button></div>
  <p class="hint" style="margin-top:10px">Signing out removes this device's local copy of your data. It stays safe on the server and returns when you sign in.</p>`;
}

async function apiFetch(path,body){
  const r=await fetch(path,{method:body===undefined?'GET':'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'agrimargin'},body:body===undefined?undefined:JSON.stringify(body)});
  let j=null;try{j=await r.json();}catch(e){}
  return {status:r.status,ok:r.ok,json:j&&j.app==='AgriMargin'?j:null};
}
async function syncProbe(){
  if(!/^https?:$/.test(location.protocol)||typeof fetch!=='function'){Sync.mode='off';return;}
  try{const r=await apiFetch('/api/session');Sync.mode=!r.json?'off':(r.json.authed?'on':'login');Sync.hasRecovery=r.json&&r.json.authed?!!r.json.hasRecovery:null;}
  catch(e){Sync.mode='offline';}
}

  const brand=t=>`<div class="brand" style="padding:0 0 14px"><div class="logo">${ICON('leaf',22)}</div><div><b>AgriMargin</b><small>${t}</small></div></div>`;
  root.innerHTML=kind==='reset'
   ?`<div class="modal-back auth-back"><form id="resetForm" class="modal" style="max-width:400px" novalidate autocomplete="off"><div class="modal-body">${brand('Reset your password')}${field('r-key','Recovery key',{name:'recoveryKey',ph:'XXXX-XXXX-XXXX-XXXX-XXXX',max:40})}${field('r-new','New password',{name:'next',type:'password',hint:'At least 8 characters'})}${field('r-conf','Confirm new password',{name:'confirm',type:'password'})}<small class="err" id="resetErr">${esc(msg||'')}</small><div class="form-actions"><button class="btn primary" type="submit" style="flex:1">Reset password</button></div><p class="muted" style="margin-top:12px;font-size:12.5px">Lost the key as well? In Render set <span class="mono">RESET_AUTH=true</span>, redeploy, sign in with your original <span class="mono">APP_PASSWORD</span>, then remove the variable.</p><p style="margin-top:8px"><button type="button" class="link" data-action="auth-back">Back to sign in</button></p></div></form></div>`
   :`<div class="modal-back auth-back"><form id="loginForm" class="modal" style="max-width:380px" autocomplete="on"><div class="modal-body">${brand('Sign in to sync your data')}<div class="field"><label for="loginPw">Password</label><input id="loginPw" name="password" type="password" autocomplete="current-password"></div><small class="err" id="loginErr">${esc(msg||'')}</small><div class="form-actions"><button class="btn primary" type="submit" style="flex:1">Sign in</button></div><p style="margin-top:10px"><button type="button" class="link" data-action="auth-forgot">Forgot password?</button></p></div></form></div>`;
  const f=$(kind==='reset'?'#r-key':'#loginPw');if(f)f.focus();
}
function hideLogin(){$('#authRoot').innerHTML='';$('#app').removeAttribute('inert');}
async function doLogin(){
  const pw=$('#loginPw').value;if(!pw)return;
  try{
    const r=await apiFetch('/api/login',{password:pw});
    if(r.ok){Sync.mode='on';Sync.err='';Sync.hasRecovery=!!(r.json&&r.json.hasRecovery);hideLogin();toast('Signed in – syncing');syncNow();}
    else $('#loginErr').textContent=r.status===429?'Too many attempts. Try again in a few minutes.':'Incorrect password.';
  }catch(e){$('#loginErr').textContent='Could not reach the server.';}
}
/* ---------- password change, recovery key, reset, sign-out ---------- */
let authBusy=false;
const authMsg=r=>r.status===429?'Too many attempts. Try again in a few minutes.':((r.json&&r.json.error)||'Something went wrong');
function showRecoveryKey(key,title){
  Modal.open({title:title||'Your recovery key',body:`<div data-sticky><div class="notice warn">Save this key somewhere safe (a password manager or printed). It is shown <b>only once</b> and is the only way to reset a forgotten password. Anyone with the key can reset your password.</div><div class="res-hero" style="margin:0"><div class="l">Recovery key</div><div class="v mono" id="recKey" style="font-size:20px;letter-spacing:.04em;user-select:all;overflow-wrap:anywhere">${esc(key)}</div></div></div>`,
   footer:`<button class="btn" data-action="rec-copy">Copy</button><button class="btn" data-action="rec-download">Download .txt</button><button class="btn primary" data-action="modal-close">I have saved it</button>`});
}
function openChangePassword(){
  Modal.open({title:'Change password',body:`<form id="pwForm" novalidate autocomplete="off">${field('p-cur','Current password',{name:'current',type:'password'})}${field('p-new','New password',{name:'next',type:'password',hint:'At least 8 characters'})}${field('p-conf','Confirm new password',{name:'confirm',type:'password'})}<p class="muted">Other devices will be asked to sign in again with the new password. Your data is not affected.</p></form>`,
   footer:`<button class="btn" data-action="modal-close">Cancel</button><button class="btn primary" type="submit" form="pwForm">Change password</button>`});
}
function openRecoveryKeyForm(){
  Modal.open({title:Sync.hasRecovery?'Replace recovery key':'Create recovery key',body:`<form id="recForm" novalidate autocomplete="off"><p style="margin-bottom:12px">${Sync.hasRecovery?'A new key replaces the old one, which will stop working.':'The key lets you reset a forgotten password.'} Confirm your password to continue.</p>${field('k-pw','Password',{name:'password',type:'password'})}</form>`,
   footer:`<button class="btn" data-action="modal-close">Cancel</button><button class="btn primary" type="submit" form="recForm">Generate key</button>`});
}
async function doChangePassword(){
  const f=$('#pwForm');if(!f||authBusy)return;const g=n=>f.elements[n].value,errors={};
  if(!g('current'))errors.current='Enter your current password';
  if(g('next').length<8)errors.next='New password must be at least 8 characters';
  else if(g('next')===g('current'))errors.next='Choose a password different from the current one';
  if(g('confirm')!==g('next'))errors.confirm='Passwords do not match';
  if(Object.keys(errors).length){const first=showErrors(f,errors);if(first)first.focus();return;}
  authBusy=true;
  try{
    const r=await apiFetch('/api/change-password',{current:g('current'),next:g('next')});
    if(r.ok){Modal.close();toast('Password changed. Other devices will need to sign in again.');}
    else showErrors(f,r.status===400?{next:authMsg(r)}:{current:authMsg(r)});
  }catch(e){showErrors(f,{next:'Could not reach the server'});}
  finally{authBusy=false;}
}
async function doRecoveryKey(){
  const f=$('#recForm');if(!f||authBusy)return;
  if(!f.elements.password.value){showErrors(f,{password:'Enter your password'});return;}
  authBusy=true;
  try{
    const r=await apiFetch('/api/recovery-key',{password:f.elements.password.value});
    if(r.ok&&r.json&&r.json.recoveryKey){Sync.hasRecovery=true;showRecoveryKey(r.json.recoveryKey);renderSyncStatus();}
    else showErrors(f,{password:authMsg(r)});
  }catch(e){showErrors(f,{password:'Could not reach the server'});}
  finally{authBusy=false;}
}
async function doReset(){
  const f=$('#resetForm');if(!f||authBusy)return;const g=n=>f.elements[n].value,errors={};
  if(!g('recoveryKey').trim())errors.recoveryKey='Enter your recovery key';
  if(g('next').length<8)errors.next='New password must be at least 8 characters';
  if(g('confirm')!==g('next'))errors.confirm='Passwords do not match';
  if(Object.keys(errors).length){const first=showErrors(f,errors);if(first)first.focus();return;}
  authBusy=true;
  try{
    const r=await apiFetch('/api/reset-password',{recoveryKey:g('recoveryKey'),next:g('next')});
    if(r.ok&&r.json&&r.json.recoveryKey){Sync.mode='on';Sync.err='';Sync.hasRecovery=true;hideLogin();showRecoveryKey(r.json.recoveryKey,'Password reset – save your new recovery key');syncNow();}
    else showErrors(f,r.status===400?{next:authMsg(r)}:{recoveryKey:authMsg(r)});
  }catch(e){showErrors(f,{recoveryKey:'Could not reach the server'});}
  finally{authBusy=false;}
}
function wipeLocal(){
  clearTimeout(Sync.timer);
  DB.records=[];DB.seq=0;resetSyncMeta();DB.mem=null;DB.writeFailed=false;DB.corrupt=false;DB.dropped=0;
  try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'.corrupt-backup');}catch(e){}
  S.calc={editingId:null,draft:null};S.period={key:'all',from:'',to:''};S.report='daily';
  S.tk={q:'',from:'',to:'',commodity:'',customer:'',sort:{key:'date',dir:'desc'},page:1};
  S.tx={q:'',type:'',commodity:'',customer:'',status:'',from:'',to:'',sort:{key:'date',dir:'desc'},page:1};
}
async function signOut(){
  const ok=await confirmDialog({title:'Sign out and clear this device?',message:'Your data stays safe on the server. Signing out <b>removes the local copy from this device</b>; it downloads again when you sign in. Any changes not yet uploaded are sent first.',confirmLabel:'Sign out',danger:true});
  if(!ok)return;
  clearTimeout(Sync.timer);
  for(let i=0;i<40&&Sync.busy;i++)await new Promise(r=>setTimeout(r,100));
  await syncNow();
  for(let i=0;i<40&&Sync.busy;i++)await new Promise(r=>setTimeout(r,100));
  const n=pendingCount();
  if(n>0){
    const ok2=await confirmDialog({title:'Some changes have not uploaded',message:`<b>${n}</b> change${n===1?'':'s'} on this device could not be uploaded and will be <b>permanently lost</b> if you sign out now. Cancel, connect to the internet and press “Sync now”, or export a JSON backup first.`,confirmLabel:'Discard and sign out',danger:true});
    if(!ok2){renderSyncStatus();return;}
  }
  try{await apiFetch('/api/logout',{});}catch(e){}
  wipeLocal();Sync.mode='login';Sync.err='';Sync.hasRecovery=null;
  Modal.close();render();showLogin();
}

function afterRemoteChange(){
  refreshLists();updateChrome();
  if(Modal.isOpen()||S.view==='calculator')return;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&view().contains(a))return;
  VIEWS[S.view]();
}
async function syncRound(){
  const sent=new Map();DB.dirty.forEach(id=>{const r=getRec(id);if(r)sent.set(id,r.updatedAt);});
  const tombs=Object.entries(DB.tomb).map(([id,at])=>({id,at}));
  const r=await apiFetch('/api/sync',{serverId:DB.serverId,since:DB.syncRev,seq:DB.seq,upserts:[...sent.keys()].map(getRec),deletes:tombs});
  if(r.status===401){Sync.mode='login';showLogin();throw Object.assign(new Error('auth'),{quiet:true});}
  if(r.status===404||!r.json){Sync.mode='off';throw Object.assign(new Error('off'),{quiet:true});}
  if(!r.ok)throw new Error('Server returned '+r.status);
  const j=r.json;
  if(j.reset)return j;
  Sync.mode='on';
  DB.seq=Math.max(DB.seq,j.seq|0);
  let changed=false;
  for(const id of j.conflicts||[]){                       // same id created on two devices → renumber ours
    if(!getRec(id))continue;
    const nid=nextId();
    DB.records=DB.records.map(x=>x.id===id?Object.assign({},x,{id:nid,updatedAt:nowIso()}):x);
    DB.dirty.delete(id);DB.dirty.add(nid);sent.delete(id);changed=true;
  }
  sent.forEach((ua,id)=>{const l=getRec(id);if(l&&l.updatedAt===ua)DB.dirty.delete(id);});
  for(const raw of j.upserts||[]){
    const s=sanitizeRecord(raw);if(!s.rec)continue;
    const rec=s.rec,l=getRec(rec.id);
    if(l&&DB.dirty.has(rec.id)&&l.updatedAt>=rec.updatedAt)continue;
    if(l){if(l.updatedAt!==rec.updatedAt||l.createdAt!==rec.createdAt){DB.records[DB.records.indexOf(l)]=rec;changed=true;}}
    else{DB.records.push(rec);changed=true;}
    delete DB.tomb[rec.id];
  }
  for(const id of j.deletes||[]){const l=getRec(id);if(l&&!DB.dirty.has(id)){DB.records=DB.records.filter(x=>x.id!==id);changed=true;}}
  tombs.forEach(t=>{if(DB.tomb[t.id]===t.at)delete DB.tomb[t.id];});
  DB.syncRev=j.rev|0;DB.serverId=j.serverId;DB.lastSync=nowIso();
  persist(true);
  if(changed)afterRemoteChange();
  return j;
}
async function syncNow(manual){
  if(!syncEnabled())return;
  if(Sync.busy){Sync.again=true;return;}
  Sync.busy=true;Sync.err='';renderSyncStatus();
  try{
    if(!DB.serverId&&DB.records.length)DB.records.forEach(r=>DB.dirty.add(r.id));   // first sync ever: upload what is already here
    for(let i=0;i<4;i++){
      const res=await syncRound();
      if(res.reset){                                                               // server data was reset → re-upload everything we have
        DB.serverId='';DB.syncRev=0;DB.records.forEach(r=>DB.dirty.add(r.id));continue;
      }
      if(!(res.conflicts&&res.conflicts.length))break;                             // renumbered records need one more round to upload
    }
    if(manual)toast('Sync complete');
  }catch(e){
    if(!e.quiet){
      if(e&&e.name==='TypeError'){Sync.mode='offline';if(manual)toast('Offline – changes will sync later','warn');}
      else{Sync.err=e.message||'Sync failed';if(manual)toast('Sync failed: '+Sync.err,'error');}
    }
  }finally{
    Sync.busy=false;renderSyncStatus();
    if(Sync.again){Sync.again=false;scheduleSync(300);}
  }
}
Object.assign(ACTIONS,{
  'sync-now':()=>syncNow(true),
  'sync-logout':()=>signOut(),
  'auth-forgot':()=>showLogin('','reset'),'auth-back':()=>showLogin('','login'),
  'pw-change':()=>openChangePassword(),'rec-open':()=>openRecoveryKeyForm(),
  'rec-copy':async()=>{const k=($('#recKey')||{}).textContent||'';try{await navigator.clipboard.writeText(k);toast('Recovery key copied');}catch(e){const r=document.createRange();r.selectNodeContents($('#recKey'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Select and copy the key shown','info');}},
  'rec-download':()=>{const k=($('#recKey')||{}).textContent||'';download('agrimargin-recovery-key.txt','AgriMargin recovery key\r\n\r\n'+k+'\r\n\r\nKeep this file private. Anyone with this key can reset your AgriMargin password.\r\n','text/plain;charset=utf-8');}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')scheduleSync(200);});
window.addEventListener('online',()=>scheduleSync(300));
window.addEventListener('offline',()=>{if(Sync.mode==='on'){Sync.mode='offline';renderSyncStatus();}});
setInterval(()=>{if(syncEnabled()&&!Sync.busy&&!document.hidden)syncNow();},45000);

  buildShell();dbLoad();route();
  syncProbe().then(()=>{if(Sync.mode==='login')showLogin();else if(syncEnabled())syncNow();renderSyncStatus();});
}catch(err){
  document.getElementById('view').innerHTML='<div class="card"><h3>Something went wrong</h3><p class="muted">'+esc(err&&err.message)+'</p></div>';
  if(window.console)console.error(err);
}
window.AgriMargin={version:'1.2',_test:{Sync,syncNow,getRec,dbSetRecords,fmtIN,inr,standardMetrics,profitInternal,effMargin,aggregate,DB,S,sanitizeRecord,pdfReport,makePDF,computeAlerts,periodRange,reportRows,toCSV}};
